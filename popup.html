<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi Search</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #1f2329;
      background: #ffffff;
    }
    header {
      background: #1a73e8;
      color: #fff;
      padding: 12px 14px;
    }
    header h1 { margin: 0; font-size: 15px; }
    header p { margin: 4px 0 0; font-size: 11px; opacity: 0.9; }
    section { padding: 12px 14px; border-bottom: 1px solid #eceef1; }
    section:last-of-type { border-bottom: none; }
    h2 {
      margin: 0 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #5f6368;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .primary { width: 100%; background: #1a73e8; color: #fff; }
    .primary:hover { background: #1761c9; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row + .row { margin-top: 8px; }
    label.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .palette input[type="color"] {
      width: 100%;
      height: 26px;
      padding: 0;
      border: 1px solid #d4d7dd;
      border-radius: 5px;
      background: none;
      cursor: pointer;
    }
    .ghost {
      background: #f1f3f4;
      color: #1f2329;
      font-weight: 500;
      padding: 6px 10px;
      font-size: 12px;
    }
    .ghost:hover { background: #e6e8ea; }
    .hint { font-size: 11px; color: #5f6368; margin: 8px 0 0; }
    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #f1f3f4;
      border: 1px solid #d4d7dd;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
    }
    #status { font-size: 11px; color: #1a73e8; min-height: 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Multi Search</h1>
    <p>Find multiple terms at once, each in its own colour.</p>
  </header>

  <section>
    <button class="primary" id="open">Open search bar on this page</button>
    <p class="hint">
      Shortcuts: <kbd>Ctrl</kbd>+<kbd>F</kbd> (when enabled below) or
      <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd>.
    </p>
    <div id="status"></div>
  </section>

  <section>
    <h2>Behaviour</h2>
    <label class="toggle">
      <input type="checkbox" id="intercept" />
      Replace the browser's <kbd>Ctrl</kbd>+<kbd>F</kbd>
    </label>
  </section>

  <section>
    <h2>Highlight colour palette</h2>
    <div class="palette" id="palette"></div>
    <div class="row" style="margin-top: 10px;">
      <button class="ghost" id="reset">Reset to defaults</button>
      <span class="hint" id="saved" style="margin: 0;"></span>
    </div>
    <p class="hint">New search terms pick the next colour from this palette.</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
